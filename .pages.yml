      sort:
      - weight
      - title
      default:
        sort: weight
        order: asc
    fields:
    - name: title
      label: Name
      type: string
      required: true
    - name: short
      label: Short name
      description: Used on small chips, e.g. "DMT"
      type: string
    - name: description
      label: One-line description
      type: text
    - name: country
      label: Country
      description: Netherlands goes under the "Netherlands" filter, everything else under "Abroad"
      type: select
      default: NL
      options:
        values:
        - name: NL
          label: Netherlands
        - name: BE
          label: Belgium
        - name: DE
          label: Germany
        - name: LU
          label: Luxembourg
        - name: FR
          label: France
        - name: UK
          label: United Kingdom
        - name: IE
          label: Ireland
        - name: AT
          label: Austria
        - name: CH
          label: Switzerland
        - name: IT
          label: Italy
        - name: ES
          label: Spain
        - name: PT
          label: Portugal
        - name: false
          label: Norway
        - name: SE
          label: Sweden
        - name: FI
          label: Finland
        - name: DK
          label: Denmark
        - name: PL
          label: Poland
        - name: CZ
          label: Czechia
    - name: region
      label: Region
      type: string
    - name: route_type
      label: Route type
      type: select
      options:
        values:
        - Linear
        - Circular
        - Summit
        - Network
    - name: start
      label: Start
      type: string
    - name: finish
      label: Finish
      type: string
    - name: distance_km
      label: Total distance in km
      description: Leave empty to add up the stages' GPX files
      type: number
    - name: ascent_m
      label: Total ascent in m
      description: Leave empty to add up the stages' GPX files
      type: number
    - name: gpx
      label: GPX of the whole trail (optional)
      type: file
      options:
        media: gpx
        extensions:
        - gpx
    - name: website
      label: Official website
      type: string
    - name: cover
      label: Cover photo
      type: image
      options:
        media: images
    - name: cover_alt
      label: Cover photo description (alt text)
      type: string
    - name: status
      label: Status (optional)
      description: Leave empty to work it out from your stories
      type: select
      options:
        values:
        - Planned
        - In progress
        - Completed
        - Walked
    - name: good_to_know
      label: Good to know
      type: object
      list: true
      fields:
      - name: icon
        label: Icon
        type: select
        options:
          values:
          - train
          - water
          - tent
          - info
          - map
          - clock
          - food
          - euro
          - flag
          - compass
      - name: text
        label: Text
        type: string
    - name: weight
      label: Order
      description: Lower numbers come first on the Trails page
      type: number
      default: 10
    - name: body
      label: About the trail
      type: rich-text
      options:
        format: markdown
        media: images
  - name: stages_nl
