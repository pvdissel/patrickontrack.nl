<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}" class="no-js">
<head>
{{- partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }}{{ with .Section }} section-{{ . }}{{ end }}">
<a class="skip" href="#main">{{ T "skip" }}</a>
{{ partial "header.html" . }}
<main id="main">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
{{ partial "scripts.html" . }}
</body>
</html>
