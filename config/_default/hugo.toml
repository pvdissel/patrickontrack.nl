baseURL = 'https://patrickontrack.nl/'
languageCode = 'en-us'
title = 'Patrick on Track'

[params]
    author = 'Patrick van Dissel'
    description = 'Taking it one step at a time'
    long-description = 'Taking it one step at a time, tracks on trails during adventures'
    featured_image = "images/20221005_113904.jpg"

defaultContentLanguage = "en"

menu = 'main'

[taxonomies]
    tag = "tags"
    category = "categories"
    adventure = "adventures" # a bigger goal/adventure. Can consist of multiple trips
    trip = "trips" # a trip of one or more connected days. Has a start and a end datetime, can consist of one ore more trails
    trail = "trails" # one specific trail, which can consist of multiple sections
    track = "tracks" # a specific version of a trail, or a section of a trail
