# Build the site with Hugo and deploy it to GitHub Pages.
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_ENVIRONMENT: production
      TZ: Europe/Amsterdam
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Same Hugo as locally: ./hugow reads the version from .hugo-version
      - name: Cache Hugo binary
        uses: actions/cache@v4
        with:
          path: .hugo
          key: hugo-${{ runner.os }}-${{ hashFiles('.hugo-version') }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Cache Hugo resources (resized images)
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-resources-${{ hashFiles('static/images/**', 'static/gpx/**') }}
          restore-keys: hugo-resources-
      - name: Build
        run: |
          ./hugow version
          ./hugow --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
