# GENERATED by scripts/pages-config.py from scripts/pages.base.yml — edit those, not this file.
# Pages CMS configuration for patrickontrack.nl (Hugo). Docs: https://pagescms.org/docs/configuration/
# Nederlands (content/nl) holds every page and all its data.
# English (translations/en) only holds English text; the rest is taken from the Dutch page.

media:
- name: images
  label: Photos
  input: static/images
  output: /images
  categories:
  - image
- name: gpx
  label: GPX files
  input: static/gpx
  output: /gpx
  extensions:
  - gpx
content:
- name: nl
  label: Nederlands
  type: group
  items:
  - name: stories_nl
    label: Stories
    type: collection
    path: content/nl/stories
    exclude:
    - _index.md
    filename:
      template: '{year}-{month}-{day}-{primary}.md'
      field: create
    view:
      fields:
      - title
      - date
      - trail
      - draft
      primary: title
      search:
      - title
      - description
      sort:
      - date
      - title
      default:
        sort: date
        order: desc
    fields:
    - name: title
      label: Title
      type: string
      required: true
    - name: date
      label: Date
      description: The day of the hike (time = when you started)
      type: date
      options:
        time: true
        format: yyyy-MM-dd'T'HH:mm:ssXXX
    - name: draft
      label: Draft
      description: Drafts are only visible locally (hugo server -D)
      type: boolean
      default: true
    - name: description
      label: Short summary
      description: One or two sentences, shown on cards and in search results
      type: text
    - name: cover
      label: Cover photo
      type: image
      options:
        media: images
    - name: cover_alt
      label: Cover photo description (alt text)
      type: string
    - name: trip
      label: Trip
      description: The trip this day belongs to, e.g. "Dutch Mountain Trail in 3 days"
      type: reference
      options:
        collection: trips_nl
        search: title
    - name: trail
      label: Trail
      type: reference
      options:
        collection: trails_nl
        search: title
    - name: stages
      label: Stages walked
      description: The official stages this day covers
      type: reference
      options:
        collection: stages_nl
        multiple: true
        search: title
        label: '{primary} · {name}'
    - name: track
      label: My GPX track
      description: What you actually walked (export from Komoot, Garmin, Strava…)
      type: file
      options:
        media: gpx
        extensions:
        - gpx
    - name: stays
      label: Where I slept
      type: reference
      options:
        collection: stays_nl
        multiple: true
        search: title
    - name: gear
      label: Gear list
      description: Only if this day differs from the trip's gear list
      type: reference
      options:
        collection: gear_nl
        search: title
    - name: youtube
      label: YouTube video
      description: Video URL or ID
      type: string
    - name: route_note
      label: Compared to the plan
      description: e.g. "Stages 1 and 2, then off the trail to a campsite"
      type: string
    - name: moments
      label: The day in moments
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{time} {title}'
      fields:
      - name: time
        label: Time
        type: string
      - name: title
        label: What happened
        type: string
      - name: text
        label: Details
        type: string
    - name: start_time
      label: Start time (overrides GPX)
      description: HH:MM — only needed without a GPX with timestamps
      type: string
    - name: end_time
      label: Finish time (overrides GPX)
      type: string
    - name: distance_km
      label: Distance in km (overrides GPX)
      type: number
    - name: ascent_m
      label: Ascent in m (overrides GPX)
      type: number
    - name: body
      label: Story
      type: rich-text
      options:
        format: markdown
        media: images
  - name: trips_nl
    label: Trips
    type: collection
    path: content/nl/trips
    exclude:
    - _index.md
    filename:
      template: '{primary}.md'
      field: create
    view:
      fields:
      - title
      - trail
      - draft
      primary: title
      search:
      - title
      - description
    fields:
    - name: title
      label: Name
      description: e.g. "Dutch Mountain Trail in 3 days"
      type: string
      required: true
    - name: draft
      label: Draft
      type: boolean
      default: true
    - name: description
      label: Short summary
      type: text
    - name: cover
      label: Cover photo
      type: image
      options:
        media: images
    - name: cover_alt
      label: Cover photo description (alt text)
      type: string
    - name: trail
      label: Main trail
      description: Its stages are drawn on the trip map (stages walked on this trip stand out)
      type: reference
      options:
        collection: trails_nl
        search: title
    - name: gear
      label: Gear list
      description: Used by every day of the trip, unless a story picks its own
      type: reference
      options:
        collection: gear_nl
        search: title
    - name: run_up
      label: The run-up
      description: Earlier trips that were preparation for this one
      type: reference
      options:
        collection: trips_nl
        multiple: true
        search: title
    - name: youtube
      label: YouTube video (whole trip)
      type: string
    - name: body
      label: Intro
      type: rich-text
      options:
        format: markdown
        media: images
  - name: trails_nl
    label: Trails
    type: collection
    path: content/nl/trails
    exclude:
    - _index.md
