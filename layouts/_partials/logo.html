{{- /* Logo mark. variant: "solid" (forest tile) or "light" (for dark backgrounds). */ -}}
{{- $size := .size | default 40 -}}
{{- if eq .variant "light" -}}
<svg class="logo-mark" width="{{ $size }}" height="{{ $size }}" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M5 31L16 16l6.5 8.5 7.5-12L43 31" fill="none" stroke="#E9EEE6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 39c7-4 14 1 21-1.5s8-3 11-3" fill="none" stroke="#E8935A" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 5"/><circle cx="39.5" cy="34.5" r="2.6" fill="#E8935A"/></svg>
{{- else -}}
<svg class="logo-mark" width="{{ $size }}" height="{{ $size }}" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><rect width="48" height="48" rx="11" fill="#1E3D2F"/><path d="M7 31L17 17l6 8 7-11 11 17" fill="none" stroke="#E9EEE6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 38c7-4 13 1 20-1.5s7-3 10-3" fill="none" stroke="#C8641E" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 5"/><circle cx="39" cy="33.5" r="2.6" fill="#C8641E"/></svg>
{{- end -}}
