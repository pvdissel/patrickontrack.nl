{{ define "main" }}
<section class="wrap page-head stack" style="--gap: 18px">
  <p class="eyebrow">{{ .Title }}</p>
  <h1 class="title-l">{{ .Params.heading | default (T "trails_heading") }}</h1>
  {{- with .Params.intro }}<p class="lead">{{ . }}</p>{{ end }}
  <div class="filters" role="group" aria-label="{{ T "filter_trails" }}" data-filter-group="trails" style="margin-top: 16px">
    <button class="filter" type="button" data-filter="all" aria-pressed="true">{{ T "all" }}</button>
    <button class="filter" type="button" data-filter="completed" aria-pressed="false">{{ T "status_completed" }}</button>
    <button class="filter" type="button" data-filter="in-progress" aria-pressed="false">{{ T "status_in-progress" }}</button>
    <button class="filter" type="button" data-filter="netherlands" aria-pressed="false">{{ T "netherlands" }}</button>
    <button class="filter" type="button" data-filter="abroad" aria-pressed="false">{{ T "abroad" }}</button>
  </div>
</section>
<section class="wrap" style="margin-top: 40px">
  <div class="grid" style="--min: 330px">{{ range .Pages.ByWeight }}{{ partial "cards/trail.html" (dict "page" . "level" 2) }}{{ end }}</div>
</section>
{{ end }}
