baseURL = "https://patrickontrack.nl/"
title = "Patrick on Track"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true    # /en/ and /nl/; "/" picks a language (layouts/alias.html)
enableRobotsTXT = true
timeZone = "Europe/Amsterdam"

[params]
  author = "Patrick van Dissel"
  since = "2021"
  youtube = "https://www.youtube.com/pvdissel"
  email = ""                              # optional contact address shown on About

  # Map styles visitors can switch between on every map (the first one is the default).
  # Only tile services that need no API key. The button label comes from i18n: map_style_<id>.
  # {s} in a URL is replaced by one of "subdomains" (default a, b, c).
  [[params.map.styles]]
    id = "topo"
    tiles = "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png"
    attribution = "Map data © <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors, SRTM · Style © <a href=\"https://opentopomap.org\">OpenTopoMap</a> (CC-BY-SA)"
    maxZoom = 17
  [[params.map.styles]]
    id = "osm"
    tiles = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
    attribution = "© <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors"
    maxZoom = 19
  [[params.map.styles]]
    id = "satellite"
    tiles = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
    attribution = "Imagery © <a href=\"https://www.esri.com\">Esri</a> — Source: Esri, Maxar, Earthstar Geographics and the GIS User Community"
    maxZoom = 19
    photo = true   # aerial photos: shown in their own colours, not toned down
  [[params.map.styles]]
    id = "cyclosm"
    tiles = "https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png"
    attribution = "Map data © <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors · Style © <a href=\"https://www.cyclosm.org\">CyclOSM</a>, hosted by OpenStreetMap France"
    maxZoom = 20

[taxonomies]
  tag = "tags"   # trips are their own pages now (content/<lang>/trips)

[permalinks]
  [permalinks.page]
    stories = "/stories/:year/:slug/"
    stages = "/trails/stages/:contentbasename/"

# ---------------------------------------------------------------- languages
# Content: Dutch is the main language (content/nl, everything); English text
# lives in translations/en and is combined with the Dutch data at build time.
[languages]
  [languages.en]
    weight = 1
    locale = "en"
    label = "English"
    [languages.en.params]
      tagline = "Taking it one step at a time."
      description = "Stories from long-distance trails, the routes and stages behind them, the places I slept and what I carried."
    [[languages.en.menus.main]]
      identifier = "stories"
      name = "Stories"
      pageRef = "/stories"
      weight = 10
    [[languages.en.menus.main]]
      identifier = "trails"
      name = "Trails"
      pageRef = "/trails"
      weight = 20
    [[languages.en.menus.main]]
      identifier = "stays"
      name = "Stays"
      pageRef = "/stays"
      weight = 30
    [[languages.en.menus.main]]
      identifier = "gear"
      name = "Gear"
      pageRef = "/gear"
      weight = 40
    [[languages.en.menus.main]]
      identifier = "about"
      name = "About"
      pageRef = "/about"
      weight = 50

  [languages.nl]
    weight = 2
    locale = "nl"
    label = "Nederlands"
    [languages.nl.params]
      tagline = "Stap voor stap."
      description = "Verhalen van lange-afstandswandelingen, de routes en etappes erachter, de plekken waar ik sliep en wat ik meedroeg."
    [[languages.nl.menus.main]]
      identifier = "stories"
      name = "Verhalen"
      pageRef = "/stories"
      weight = 10
    [[languages.nl.menus.main]]
      identifier = "trails"
      name = "Trails"
      pageRef = "/trails"
      weight = 20
    [[languages.nl.menus.main]]
      identifier = "stays"
      name = "Overnachtingen"
      pageRef = "/stays"
      weight = 30
    [[languages.nl.menus.main]]
      identifier = "gear"
      name = "Uitrusting"
      pageRef = "/gear"
      weight = 40
    [[languages.nl.menus.main]]
      identifier = "about"
      name = "Over mij"
      pageRef = "/about"
      weight = 50

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]
  taxonomy = ["html"]
  term = ["html"]

[markup.goldmark.renderer]
  unsafe = false
  hardWraps = true   # a new line in the editor is a new line on the page
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[imaging]
  resampleFilter = "Lanczos"
  [imaging.webp]
    quality = 78
  [imaging.jpeg]
    quality = 80
  [imaging.exif]
    disableDate = true
    disableLatLong = true   # never leak GPS from photo EXIF

# The exact version is pinned in .hugo-version and used by ./hugow and the
# GitHub workflow. This minimum only protects against an older system Hugo.
[module.hugoVersion]
  extended = true
  min = "0.158.0"

# Pages CMS uploads to static/; mount those folders into assets/ too, so
# templates can resize photos and read GPX files at build time.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"
  [[module.mounts]]
    source = "static/gpx"
    target = "assets/gpx"
  [[module.mounts]]
    source = "static"
    target = "static"
    # originals are only used as sources for resized WebP copies (no EXIF/GPS leaks, smaller deploy)
    files = ['! images/**']
  # Dutch is the main language: content/nl has every page with all its data.
  # English pages are generated by content/en/_content.gotmpl from the Dutch
  # pages plus the English text in translations/en.
  [[module.mounts]]
    source = "content/nl"
    target = "content"
    [module.mounts.sites.matrix]
      languages = ["nl"]
  [[module.mounts]]
    source = "content/en"
    target = "content"
    [module.mounts.sites.matrix]
      languages = ["en"]
  # read by the content adapter (as assets, so hugo server picks up changes)
  [[module.mounts]]
    source = "content/nl"
    target = "assets/_i18nsrc/nl"
  [[module.mounts]]
    source = "translations/en"
    target = "assets/_i18nsrc/en"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
