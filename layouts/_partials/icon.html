{{- /* Inline stroke icon. Usage: partial "icon.html" (dict "name" "route" "size" 18) */ -}}
{{- $name := .name | default "info" -}}
{{- $size := .size | default 18 -}}
<svg class="icon{{ with .class }} {{ . }}{{ end }}" width="{{ $size }}" height="{{ $size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">{{ partial "icon-paths.html" $name | safeHTML }}</svg>
{{- /**/ -}}
