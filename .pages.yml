# Pages CMS configuration for patrickontrack.nl (Hugo)
# Docs: https://pagescms.org/docs/configuration/

media:
  input: static/images     # uploads are committed here
  output: /images          # path written into front matter / markdown
  categories: [image]

# ---------------------------------------------------------------------------
# Content
# ---------------------------------------------------------------------------
content:
  - name: adventures
    label: Adventures
    type: collection
    path: content/en/adventures
    subfolders: true                        # one folder per adventure/trip
    exclude: [_index.md]
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create                         # adjust the date prefix when creating
    view:
      fields: [title, date, trips, draft]
      primary: title
      search: [title, description, adventures, trips, trails, tags]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields: &post_fields
      - &title
        name: title
        label: Title
        type: string
        required: true
      - &description
        name: description
        label: Description
        type: string
      - &date
        name: date
        label: Date
        type: date
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"   # e.g. 2022-09-10T06:00:00+02:00
      - &draft
        name: draft
        label: Draft
        type: boolean
        default: true                           # same as archetypes/default.md
      - &adventures
        name: adventures
        label: Adventures
        description: The bigger goal, e.g. "Dutch Mountain Trail in 3 days"
        type: string
        list: true
      - &trips
        name: trips
        label: Trips
        description: One or more connected days, e.g. "2022-09 DMT"
        type: string
        list: true
      - &trails
        name: trails
        label: Trails
        description: Must match the trail title exactly, e.g. "Dutch Mountain Trail"
        type: string
        list: true
      - &tracks
        name: tracks
        label: Tracks
        description: A specific version or section of a trail
        type: string
        list: true
      - &tags
        name: tags
        label: Tags
        type: string
        list: true
      - &featured_image
        name: featured_image
        label: Featured image
        type: image
      - &body
        name: body
        label: Body
        type: rich-text
        options:
          format: markdown

  - name: gear
    label: Gear
    type: collection
    path: content/en/gear
    exclude: [_index.md]
    filename:
      template: "{year}-{month}-{primary}.md"
      field: create
    view:
      fields: [title, date, trails, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields: *post_fields

  - name: trails
    label: Trails
    type: collection
    path: content/en/trails
    subfolders: true
    # Each trail is a Hugo branch bundle: trails/<trail-slug>/_index.md.
    # The folder name must equal the slug of the `trails` taxonomy term
    # (e.g. "Dutch Mountain Trail" -> dutch-mountain-trail) for Hugo to
    # attach this page to that term.
    filename: "{primary}/_index.md"
    view:
      layout: tree
      fields: [title]
      primary: title
      node:
        filename: _index.md
        hideDirs: nodes
    fields:
      - *title
      - *description
      - *date
      - *featured_image
      - name: trail_info
        label: Trail info
        type: object
        fields:
          - name: total_length
            label: Total length (km)
            type: string
          - name: altimeters
            label: Elevation gain (m)
            type: string
          - name: website
            label: Website
            type: string
      - *body

  - name: pages
    label: Pages
    type: group
    items:
      - name: home
        label: Home
        type: file
        path: content/en/_index.md
        fields:
          - *featured_image
          - *body

      - name: about
        label: About
        type: file
        path: content/en/about.md
        fields:
          - *title
          - *description
          - *featured_image
          - *body

      - name: videos
        label: Videos
        type: file
        path: content/en/videos.md
        fields:
          - *title
          - *body

      - name: adventures-index
        label: Adventures (section page)
        type: file
        path: content/en/adventures/_index.md
        fields:
          - *title
          - *date
          - *featured_image
          - *body

      - name: gear-index
        label: Gear (section page)
        type: file
        path: content/en/gear/_index.md
        fields:
          - *title
          - *date
          - *body
          