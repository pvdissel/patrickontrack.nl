{{ define "main" }}
<section class="wrap page-head stack" style="--gap: 20px; padding-block: 64px">
  <p class="eyebrow">{{ T "not_found_eyebrow" }}</p>
  <h1 class="title-xl">{{ T "not_found_title" }}</h1>
  <p class="lead">{{ T "not_found_text" }}</p>
  <div class="row"><a class="btn" href="{{ site.Home.RelPermalink }}">{{ T "back_to_start" }}</a><a class="btn btn--ghost" href="{{ (site.GetPage "/stories").RelPermalink }}">{{ T "read_stories" }}</a></div>
</section>
{{ end }}
